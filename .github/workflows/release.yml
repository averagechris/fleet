name: Reusable release

on:
  workflow_call:
    inputs:
      tag: {type: string, required: true}
      # JSON array: [{"name":"aarch64-darwin","runner":"macos-14"},
      #              {"name":"x86_64-linux","runner":"ubuntu-24.04"}]
      platforms: {type: string, required: true}
      website_repository: {type: string, required: false, default: ""}
      website_workflow: {type: string, required: false, default: "pages.yml"}
      github_app_id: {type: string, required: false, default: ""}
    secrets:
      github_app_private_key: {required: false}

jobs:
  build:
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: "${{ inputs.tag }}", persist-credentials: false}
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Verify annotated tag checkout
        env: {TAG: "${{ inputs.tag }}"}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$TAG")" = tag
          remote=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          object=$(awk -v ref="refs/tags/$TAG" '$2 == ref {print $1}' <<<"$remote")
          commit=$(awk -v ref="refs/tags/$TAG^{}" '$2 == ref {print $1}' <<<"$remote")
          test -n "$object"; test -n "$commit"
          test "$(git rev-parse "$TAG^{tag}")" = "$object"
          test "$(git rev-parse "$TAG^{commit}")" = "$commit"
          printf '%s\n%s\n' "$object" "$commit" > "release-identity-${{ matrix.platform.name }}"
      - name: Build and verify artifact
        env: {PLATFORM: "${{ matrix.platform.name }}", TAG: "${{ inputs.tag }}"}
        run: |
          set -euo pipefail
          out=$(nix build .#release-artifact --no-link --print-out-paths)
          mkdir upload
          cp "$out"/*.tar.gz "$out"/*.tar.gz.sha256 upload/
          (cd upload && shasum -a 256 -c -- *.sha256)
          version=${TAG#v}
          test -f "upload/${GITHUB_REPOSITORY#*/}-v${version}-${PLATFORM}.tar.gz"
          mv "release-identity-${PLATFORM}" upload/
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.0
        with:
          name: "release-${{ matrix.platform.name }}"
          path: upload/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: "${{ inputs.tag }}", fetch-depth: 0, persist-credentials: false}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with: {pattern: release-*, path: assets, merge-multiple: true}
      - name: Verify complete set and publish draft
        env: {GH_TOKEN: "${{ github.token }}", TAG: "${{ inputs.tag }}", PLATFORMS: "${{ inputs.platforms }}"}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$TAG")" = tag
          remote=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          object=$(awk -v ref="refs/tags/$TAG" '$2 == ref {print $1}' <<<"$remote")
          commit=$(awk -v ref="refs/tags/$TAG^{}" '$2 == ref {print $1}' <<<"$remote")
          test -n "$object"; test -n "$commit"
          test "$(git rev-parse "$TAG^{tag}")" = "$object"
          test "$(git rev-parse "$TAG^{commit}")" = "$commit"
          while IFS= read -r identity; do
            test "$(sed -n '1p' "$identity")" = "$object"
            test "$(sed -n '2p' "$identity")" = "$commit"
            test "$(wc -l < "$identity")" -eq 2
          done < <(find assets -type f -name 'release-identity-*' -print)
          test "$(find assets -type f -name 'release-identity-*' | wc -l)" -eq "$(jq length <<<"$PLATFORMS")"
          find assets -type f -name 'release-identity-*' -delete
          mapfile -t expected < <(python3 - <<'PY'
          import json,os
          repo=os.environ['GITHUB_REPOSITORY'].split('/')[-1]; version=os.environ['TAG'].removeprefix('v')
          for p in json.loads(os.environ['PLATFORMS']):
              n=f"{repo}-v{version}-{p['name']}.tar.gz"; print(n); print(n+'.sha256')
          PY
          )
          mapfile -t actual < <(find assets -type f -printf '%f\n' | sort)
          test "$(printf '%s\n' "${expected[@]}" | sort)" = "$(printf '%s\n' "${actual[@]}" | sort)"
          (cd assets && shasum -a 256 -c -- *.sha256)
          # The by-tag endpoint excludes drafts. List every page so a retry resumes
          # the draft rather than creating another release. An API failure is fatal.
          find_release() {
            local pages matches
            pages=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
            matches=$(jq -ce --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)]' <<<"$pages")
            test "$(jq length <<<"$matches")" -le 1 || { echo 'duplicate releases for tag' >&2; return 1; }
            jq -c '.[0] // empty' <<<"$matches"
          }
          check_release() {
            jq -e --arg tag "$TAG" '
              .tag_name == $tag and (.id | type == "number") and
              (.draft | type == "boolean") and (.assets | type == "array") and
              all(.assets[]; (.id | type == "number") and (.name | type == "string") and
                (.state | type == "string"))
            ' <<<"$release" >/dev/null || { echo 'invalid release response or tag mismatch' >&2; return 1; }
            if jq -e 'all(.assets[]; .state == "uploaded")' <<<"$release" >/dev/null; then
              return 0
            fi
            incomplete=$(jq -r '[.assets[] | select(.state != "uploaded") | .name] | join(", ")' <<<"$release")
            echo "release contains incomplete asset(s): $incomplete; delete the incomplete asset(s) on GitHub and rerun" >&2
            return 1
          }
          release=$(find_release)
          if [[ -z "$release" ]]; then
            gh release create "$TAG" --draft --verify-tag --target "$commit" --title "$TAG" --latest=false
            release=$(find_release)
            test -n "$release" || { echo 'release not found after create' >&2; exit 1; }
          fi
          check_release
          release_id=$(jq -r .id <<<"$release")
          draft=$(jq -r .draft <<<"$release")
          # Refuse unexpected or duplicate remote assets before any upload. A draft
          # may contain a subset; published releases must contain the full set.
          mapfile -t present < <(jq -r '.assets[].name' <<<"$release" | sort)
          test "$(printf '%s\n' "${present[@]}" | sort -u)" = "$(printf '%s\n' "${present[@]}")" || { echo 'duplicate remote assets' >&2; exit 1; }
          for name in "${present[@]}"; do
            [[ " ${expected[*]} " == *" $name "* ]] || { echo "unexpected remote asset: $name" >&2; exit 1; }
          done
          # Verify existing bytes before uploading any missing asset.
          for file in assets/*; do
            name=${file##*/}; asset_id=$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .id' <<<"$release")
            if [[ -n "$asset_id" ]]; then
              curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" -o remote
              cmp "$file" remote || { echo "refusing to clobber differing asset: $name" >&2; exit 1; }
            else
              test "$draft" = true || { echo "published release is incomplete: $name" >&2; exit 1; }
            fi
          done
          if [[ "$draft" == true ]]; then
            for file in assets/*; do
              name=${file##*/}; asset_id=$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .id' <<<"$release")
              [[ -n "$asset_id" ]] && continue
              gh release upload "$TAG" "$file"
            done
          fi
          release=$(find_release)
          test -n "$release" || { echo 'release not found after upload' >&2; exit 1; }
          check_release
          test "$(jq -r .id <<<"$release")" = "$release_id" || { echo 'release changed during upload' >&2; exit 1; }
          mapfile -t remote_names < <(jq -r '.assets[].name' <<<"$release" | sort)
          test "$(printf '%s\n' "${expected[@]}" | sort)" = "$(printf '%s\n' "${remote_names[@]}")"
          rm -rf verified; mkdir verified
          while IFS=$'\t' read -r name asset_id; do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" -o "verified/$name"
          done < <(jq -r '.assets[] | [.name,.id] | @tsv' <<<"$release")
          (cd verified && shasum -a 256 -c -- *.sha256)
          for file in assets/*; do cmp "$file" "verified/${file##*/}"; done
          final_remote=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          test "$(awk -v ref="refs/tags/$TAG" '$2 == ref {print $1}' <<<"$final_remote")" = "$object"
          test "$(awk -v ref="refs/tags/$TAG^{}" '$2 == ref {print $1}' <<<"$final_remote")" = "$commit"
          if [[ $(jq -r .draft <<<"$release") == true ]]; then gh release edit "$TAG" --draft=false --latest=false; fi
      - name: Verify website dispatch trust
        id: website-dispatch
        if: ${{ inputs.website_repository != '' }}
        env:
          APP_ID: "${{ inputs.github_app_id }}"
          HAS_APP_KEY: "${{ secrets.github_app_private_key != '' }}"
          TARGET: "${{ inputs.website_repository }}"
          TAG: "${{ inputs.tag }}"
          SHA: "${{ github.sha }}"
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == averagechris/gander ]] || { echo 'untrusted reusable-workflow caller repository' >&2; exit 1; }
          [[ "$GITHUB_REF" == "refs/tags/$TAG" ]] || { echo 'untrusted reusable-workflow caller ref' >&2; exit 1; }
          remote=$(git ls-remote --tags origin "refs/tags/$TAG^{}")
          commit=${remote%%$'\t'*}; [[ -n "$commit" && "$commit" == "$SHA" ]] || { echo 'caller SHA is not the release tag commit' >&2; exit 1; }
          [[ "$TARGET" == averagechris/averagechris.github.io ]] || { echo 'untrusted website dispatch target repository' >&2; exit 1; }
          if [[ -z "$APP_ID" || "$HAS_APP_KEY" != true ]]; then
            echo '::warning::GitHub App credentials absent; website dispatch skipped (hourly/manual backstop required)'; exit 0
          fi
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - name: Mint website dispatch token
        id: website-token
        if: ${{ steps.website-dispatch.outputs.enabled == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.github_app_id }}
          private-key: ${{ secrets.github_app_private_key }}
          owner: averagechris
          repositories: averagechris.github.io
          permission-actions: write
          permission-contents: read
      - name: Dispatch website refresh
        if: ${{ steps.website-dispatch.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: "${{ steps.website-token.outputs.token }}"
          TARGET: "${{ inputs.website_repository }}"
          WORKFLOW: "${{ inputs.website_workflow }}"
          TAG: "${{ inputs.tag }}"
          SHA: "${{ github.sha }}"
        run: |
          set -euo pipefail
          jq -nc --arg project "${GITHUB_REPOSITORY#*/}" --arg tag "$TAG" --arg sha "$SHA" \
            '{ref:"main",inputs:{project:$project,tag:$tag,sha:$sha}}' \
            | gh api --method POST "repos/$TARGET/actions/workflows/$WORKFLOW/dispatches" --input -
