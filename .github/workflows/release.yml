name: Reusable release artifact build

on:
  workflow_call:
    inputs:
      tag: {type: string, required: true}
      # JSON array: [{"name":"aarch64-darwin","runner":"macos-14"},
      #              {"name":"x86_64-linux","runner":"ubuntu-24.04"}]
      platforms: {type: string, required: true}

jobs:
  build:
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: "${{ inputs.tag }}", persist-credentials: false}
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Verify annotated tag checkout
        env: {TAG: "${{ inputs.tag }}"}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'tag must be vX.Y.Z' >&2; exit 1; }
          test "$(git cat-file -t "$TAG")" = tag
          remote=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          object=$(awk -v ref="refs/tags/$TAG" '$2 == ref {print $1}' <<<"$remote")
          commit=$(awk -v ref="refs/tags/$TAG^{}" '$2 == ref {print $1}' <<<"$remote")
          test -n "$object"; test -n "$commit"
          test "$(git rev-parse "$TAG^{tag}")" = "$object"
          test "$(git rev-parse "$TAG^{commit}")" = "$commit"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main || {
            echo 'release tag commit is not an ancestor of origin/main' >&2
            exit 1
          }
          printf '%s\n%s\n' "$object" "$commit" > "release-identity-${{ matrix.platform.name }}"
      - name: Build and verify artifact
        env: {PLATFORM: "${{ matrix.platform.name }}", TAG: "${{ inputs.tag }}"}
        run: |
          set -euo pipefail
          out=$(nix build .#release-artifact --no-link --print-out-paths)
          mkdir upload
          cp "$out"/*.tar.gz "$out"/*.tar.gz.sha256 upload/
          (cd upload && shasum -a 256 -c -- *.sha256)
          version=${TAG#v}
          test -f "upload/${GITHUB_REPOSITORY#*/}-v${version}-${PLATFORM}.tar.gz"
          mv "release-identity-${PLATFORM}" upload/
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.0
        with:
          name: "release-${{ matrix.platform.name }}"
          path: upload/
          if-no-files-found: error

  manual-publication:
    needs: build
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - name: Report manual publication handoff
        run: |
          {
            echo '## Manual publication required'
            echo
            echo "Download the named release artifacts and checksums from [this workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}), then follow the project's release guide to publish them."
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'manual publication required; use the run artifacts and follow the project release guide'
