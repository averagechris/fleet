# Fleet registry: the repos that share the standard release interface.
#
# Used by `nix run .#fleet-status` and by agent-driven maintenance
# (see AGENTS.md). Every repo here is expected to expose:
#
# Repos may set `ecosystem = "rust"` or `ecosystem = "go"`; omitted means rust.
#
#   nix run .#release -- --version X.Y.Z [--submit-linux-build]
#   nix run .#release -- --version X.Y.Z --check
#   nix run .#ci-fmt | ci-clippy/ci-vet | static-checks | ci-test
#
# plus: annotated vX.Y.Z tags with attached sr.ht artifacts, release manifest at
# builds/release-linux-x86_64.yml (explicit `hut builds submit` only — NOT
# .builds/), CHANGELOG.md with an `## Unreleased` section, conventional commits,
# and jj-first VCS. averagechris.srht.site is the single Pages publisher.

[fleet]
maint_workspace_root = "/Users/chris/projects/.maint"
required_apps = [
  "prepare-release",
  "release-tag",
  "release",
  "ci-fmt",
  "ci-test",
]
advisory_apps = ["static-checks"]

[fleet.ecosystems.rust]
required_apps = ["ci-clippy"]

[fleet.ecosystems.go]
required_apps = ["ci-vet"]

[[repos]]
name = "hister"
local = "/Users/chris/projects/hister"
pages_subdir = "hister"
version_file = "webui/app/package.json"
artifact_prefix = "hister"
srht_repo = "hister"
binaries = ["hister"]
ecosystem = "go"
quirks = [
  "Go repo — ci-vet instead of ci-clippy",
  "version source of truth is webui/app/package.json",
  "release apps are repo-local scripts (not fleet-lib presets); prepare-release rewrites the linux manifest version itself",
  "static-checks composes gofmt check + nixfmt flake.nix check + go vet",
]

