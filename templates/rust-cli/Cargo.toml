[package]
name = "example-cli"
version = "0.1.0"
edition = "2024"
description = "An example Rust CLI."
authors = ["Christopher Cummings"]
license = "MIT"
repository = "https://git.sr.ht/~averagechris/example-cli"
homepage = "https://git.sr.ht/~averagechris/example-cli"
readme = "README.md"
categories = ["command-line-utilities"]

[[bin]]
name = "example-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = "s"
panic = "abort"
